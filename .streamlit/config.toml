# Tema EUROTRIP 2026 — claro, limpo, acento âmbar/petróleo (viagem)
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F5"
codeBackgroundColor = "#F3F3F3"
textColor = "#1A1A1A"
linkColor = "#0F766E"
borderColor = "#E2E5E4"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
buttonRadius = "8px"
font = "'Segoe UI', 'Open Sans':https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false
chartCategoricalColors = ["#0F766E", "#D97706", "#2563EB", "#DB2777", "#65A30D", "#DC2626", "#7C3AED"]

blueColor = "#2563EB"
greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
grayColor = "#737373"

dataframeBorderColor = "#E2E5E4"
dataframeHeaderBackgroundColor = "#F4F6F5"

[theme.sidebar]
backgroundColor = "#F4F6F5"
secondaryBackgroundColor = "#EAEDEC"
textColor = "#1A1A1A"
borderColor = "#E2E5E4"
primaryColor = "#0F766E"
